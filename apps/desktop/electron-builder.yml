appId: host.tucker.roomjukebox
productName: Room Jukebox
artifactName: 'RoomJukebox-Setup-${version}.${ext}'
directories:
  output: release
  buildResources: build
# main.cjs and preload.cjs are self-contained esbuild bundles (server, core and shared included).
files:
  - dist/**/*
  - package.json
extraResources:
  # The built SPA, served by the embedded hub server (Hub mode) or the loopback server (Player mode).
  - from: ../web/dist
    to: web
  # Elevated "Fix firewall" script (README); the wizard will call it later.
  - from: build/fix-firewall.ps1
    to: fix-firewall.ps1
  # Tray icon (the window and installer icons come from build/icon.ico).
  - from: build/icon.png
    to: icon.png
  # This build's notes and test checklist (scripts/release-notes.mjs; served as "What's new").
  - from: build/release-notes.json
    to: release-notes.json
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  include: build/installer.nsh
# The app picks its feed at runtime (desktop-state `updateFeed`: Tango's generic feed or this
# GitHub repo); this entry only fills app-update.yml.
publish:
  provider: github
  owner: jason-tucker
  repo: room-jukebox
  releaseType: draft
